          minimum: 1
      security:
      - cookieAuth: []
        csrfHeader: []
  /api/v1/admin/pengguna/{pengguna}/nonaktifkan:
    post:
      tags:
      - Pengguna (admin)
      summary: 409 bila guru masih punya tanggungan aktif.
      operationId: pengguna_nonaktifkan
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PenggunaResource'
        '401':
          description: 'Belum login / akun nonaktif (code: unauthenticated)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'Tidak berwenang (code: forbidden)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'Tidak ditemukan (code: not_found)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 'Konflik aturan bisnis. Kode kemungkinan: teacher_has_active_subjects, teacher_has_upcoming_schedule, teacher_is_active_homeroom'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 'Validasi gagal (code: validation_error, errors per field)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Terlalu banyak permintaan (code: too_many_requests, header Retry-After)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: POST /admin/pengguna/{pengguna}/nonaktifkan — 409 bila guru masih punya tanggungan aktif.
      x-akses:
