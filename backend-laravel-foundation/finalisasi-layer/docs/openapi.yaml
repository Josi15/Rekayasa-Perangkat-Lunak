        hanya ada pada respons check-in (dihitung server, tidak disimpan). Presensi
      properties:
        id_presensi: {}
        id_siswa: {}
        id_jadwal: {}
        siswa: {}
        jadwal: {}
        waktu_checkin: {}
        status_kehadiran: {}
