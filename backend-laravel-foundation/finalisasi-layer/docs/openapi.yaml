        relasi presensi yang sudah difilter ke jadwal tersebut. Pengguna'
      properties:
        id_siswa: {}
        nisn: {}
        username: {}
        akun_aktif: {}
        status_kehadiran: {}
        presensi: {}
    RekapPresensiResource:
