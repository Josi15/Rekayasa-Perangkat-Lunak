      description: POST /api/v1/auth/login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                login:
                  type: string
                password:
                  type: string
              required:
              - login
              - password
      security: []
  /api/v1/auth/logout:
    post:
      tags:
      - Autentikasi
      summary: Logout, mengakhiri sesi
      operationId: logout
      responses:
        '204':
          description: Berhasil
        '401':
          description: 'Belum login / akun nonaktif (code: unauthenticated)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 'Validasi gagal (code: validation_error, errors per field)'
          content:
            application/json:
