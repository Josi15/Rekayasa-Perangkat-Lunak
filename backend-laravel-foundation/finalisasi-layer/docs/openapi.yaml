openapi: 3.0.3
info:
  title: LMS Simba API
  version: 1.0.0
  description: 'Dibangkitkan otomatis dari kode (route, FormRequest, Resource, service) oleh verify/gen_openapi.py. Autentikasi: cookie sesi Sanctum
    SPA + header X-XSRF-TOKEN (CSRF). Format error: {message, code, errors?, request_id}. Daftar field Resource adalah nama field; tipe tiap field
    mengikuti docs/API-*.md. Dokumen ini BELUM diuji terhadap server yang berjalan.'
servers:
- url: http://lms-simba.test
  description: Lokal (Laravel Herd)
- url: https://api.contoh.sekolah.id
  description: Produksi (contoh)
tags:
- name: Health
- name: Profil
- name: Kelas & keanggotaan
- name: Mata pelajaran
- name: Materi
- name: Tugas
- name: Pengumpulan tugas
- name: Kuis
- name: Nilai
- name: Jadwal
- name: Presensi
- name: Pengumuman
- name: Dashboard
- name: Pengguna (admin)
- name: Autentikasi
paths:
  /api/v1/admin/pengguna:
    get:
      tags:
      - Pengguna (admin)
      summary: Daftar pengguna (admin)
      operationId: pengguna_index
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PenggunaResource'
                  links:
                    type: object
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          description: 'Belum login / akun nonaktif (code: unauthenticated)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'Tidak berwenang (code: forbidden)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 'Validasi gagal (code: validation_error, errors per field)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Terlalu banyak permintaan (code: too_many_requests, header Retry-After)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: GET /admin/pengguna?cari=&peran=&status=&urut=&arah=&page=&per_page=
      x-akses:
        peran:
        - admin
        policy:
        - viewAny
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
      - name: cari
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: urut
        in: query
        required: false
        schema:
          type: string
      - name: arah
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
      - name: peran
        in: query
        required: false
        schema:
          type: string
      security:
      - cookieAuth: []
        csrfHeader: []
    post:
      tags:
      - Pengguna (admin)
      summary: Buat pengguna (admin)
      operationId: pengguna_store
      responses:
        '201':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PenggunaResource'
        '401':
          description: 'Belum login / akun nonaktif (code: unauthenticated)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'Tidak berwenang (code: forbidden)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 'Validasi gagal (code: validation_error, errors per field)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Terlalu banyak permintaan (code: too_many_requests, header Retry-After)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: POST /admin/pengguna
      x-akses:
        peran:
        - admin
        policy:
        - create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                peran:
                  type: string
                nisn:
                  type: string
                nip:
                  type: string
                username:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
              required:
              - peran
              - password
      security:
      - cookieAuth: []
        csrfHeader: []
  /api/v1/admin/pengguna/{pengguna}:
    get:
      tags:
      - Pengguna (admin)
      summary: Detail pengguna (admin)
      operationId: pengguna_show
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PenggunaResource'
        '401':
          description: 'Belum login / akun nonaktif (code: unauthenticated)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'Tidak berwenang (code: forbidden)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'Tidak ditemukan (code: not_found)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Terlalu banyak permintaan (code: too_many_requests, header Retry-After)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: GET /admin/pengguna/{pengguna}
      x-akses:
        peran:
        - admin
        policy:
        - view
      parameters:
      - name: pengguna
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      security:
      - cookieAuth: []
        csrfHeader: []
    patch:
      tags:
      - Pengguna (admin)
      summary: Ubah pengguna (admin)
      operationId: pengguna_update
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PenggunaResource'
        '401':
          description: 'Belum login / akun nonaktif (code: unauthenticated)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'Tidak berwenang (code: forbidden)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'Tidak ditemukan (code: not_found)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 'Validasi gagal (code: validation_error, errors per field)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Terlalu banyak permintaan (code: too_many_requests, header Retry-After)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: PATCH /admin/pengguna/{pengguna}
      x-akses:
        peran:
        - admin
        policy:
        - update
      parameters:
      - name: pengguna
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nisn:
                  type: string
                nip:
                  type: string
                username:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
      security:
      - cookieAuth: []
        csrfHeader: []
  /api/v1/admin/pengguna/{pengguna}/aktifkan:
    post:
      tags:
      - Pengguna (admin)
      summary: Aktifkan kembali akun pengguna
      operationId: pengguna_aktifkan
      responses:
        '200':
