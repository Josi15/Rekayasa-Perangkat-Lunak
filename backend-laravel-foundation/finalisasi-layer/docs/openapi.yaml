components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: laravel_session
      description: Cookie sesi (HttpOnly) diterbitkan saat login.
    csrfHeader:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: Isi dari cookie XSRF-TOKEN (didekode URL); wajib untuk metode selain GET.
  schemas:
    Error:
      type: object
      required:
      - message
      - code
      properties:
        message:
          type: string
        code:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        request_id:
          type: string
    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        last_page:
          type: integer
        from:
          type: integer
          nullable: true
        to:
          type: integer
          nullable: true
    PenggunaResource:
      type: object
      description: Representasi pengguna untuk API. Tidak pernah memuat password / remember_token. Pengguna
      properties:
        id_pengguna: {}
        nisn: {}
        nip: {}
        username: {}
        email: {}
        peran: {}
        aktif: {}
        nonaktif_pada: {}
    KelasResource:
      type: object
      description: Relasi (wali) dan jumlah_siswa hanya muncul bila dimuat controller (with / withCount). Kelas
      properties:
        id_kelas: {}
        nama_kelas: {}
        id_wali: {}
        wali: {}
        jumlah_siswa: {}
        aktif: {}
        diarsipkan_pada: {}
    PenggunaRingkasResource:
      type: object
      description: Baris daftar anggota kelas (untuk admin, wali, guru terkait). Tanpa email. Pengguna
      properties:
        id_pengguna: {}
        nisn: {}
        nip: {}
        username: {}
        peran: {}
        aktif: {}
    MataPelajaranResource:
      type: object
      description: MataPelajaran
      properties:
        id_mapel: {}
        nama_mapel: {}
        id_guru: {}
        guru: {}
        aktif: {}
        diarsipkan_pada: {}
    MateriResource:
      type: object
      description: Path penyimpanan (kolom "file") bersifat internal dan TIDAK pernah dikirim ke klien; klien mengunduh lewat url_file yang memeriksa
        izin. Materi
      properties:
        id_materi: {}
        judul: {}
        id_mapel: {}
        mapel: {}
        ekstensi: {}
        tipe: {}
        url_file: {}
        created_at: {}
        updated_at: {}
